<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparativos y Superlativos | Your Mexican Friend</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#25d9ff;--cyan2:#00bfff;--magenta:#ff2bbf;--magenta2:#ff4fd8;
  --bg1:#070019;--bg2:#160033;--text:#f0f0ff;--muted:#a8abce;--muted2:#5a5d8a;
  --good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --comp:#f472b6;--comp2:#ff91cd;--sup:#25d9ff;--sup2:#7ee8ff;
  --font:'DM Sans',system-ui,sans-serif;--display:'Syne',system-ui,sans-serif;
  --shadow:0 20px 40px rgba(0,0,0,.4),0 0 28px rgba(255,43,191,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(ellipse at 12% 8%,rgba(255,43,191,.15),transparent 30%),radial-gradient(ellipse at 88% 12%,rgba(37,217,255,.1),transparent 30%),linear-gradient(155deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.app{width:min(1020px,96%);margin:14px auto 40px;display:flex;flex-direction:column;gap:12px}

/* HERO */
.hero{border-radius:22px;padding:22px 26px;background:linear-gradient(130deg,#0a0022,#1c0050 55%,#0c002e);border:1px solid rgba(255,255,255,.09);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:38px 38px;pointer-events:none}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-box{width:64px;height:64px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0c0030,#280060);border:2px solid rgba(37,217,255,.28);box-shadow:0 0 18px rgba(255,43,191,.22);font-family:var(--display);font-size:.9rem;font-weight:900;color:var(--magenta);text-shadow:1px 1px 0 var(--cyan)}
.hero-text h1{font-family:var(--display);font-size:clamp(1.2rem,2.4vw,2rem);font-weight:900;line-height:.95;background:linear-gradient(90deg,var(--comp) 0%,#fff 40%,var(--sup) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-text p{color:var(--muted);font-size:.85rem;line-height:1.5;margin-top:4px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.badge{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700;color:var(--muted)}

/* TABS */
.ex-tabs{display:flex;gap:5px;background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:18px;padding:7px;overflow-x:auto;scrollbar-width:none}
.ex-tabs::-webkit-scrollbar{display:none}
.etab{flex-shrink:0;border:0;border-radius:11px;padding:8px 11px;font-weight:800;font-family:var(--font);font-size:.76rem;cursor:pointer;transition:.16s;color:var(--muted2);background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.etab:hover{background:rgba(255,255,255,.07);color:var(--text)}
.etab.active{background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:white;box-shadow:0 3px 0 rgba(0,0,0,.2);transform:translateY(-1px)}
.etab-icon{font-size:1.15rem;line-height:1}
.etab-label{font-size:.62rem;text-align:center;line-height:1.2;opacity:.9}

/* PANEL */
.panel{background:linear-gradient(180deg,rgba(18,4,42,.97),rgba(24,10,52,.97));border:1px solid rgba(37,217,255,.13);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow)}
.ex-title{font-family:var(--display);font-size:1.15rem;font-weight:900;margin-bottom:6px}
.ex-instr{font-size:.85rem;color:var(--muted);line-height:1.6;padding:9px 14px;background:rgba(37,217,255,.07);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0;margin-bottom:16px}
.ex-instr em{color:var(--cyan);font-style:normal;font-weight:700}

/* SCORE BAR */
.score-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sc{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;gap:1px}
.sc .l{font-size:.56rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2)}
.sc .v{font-family:var(--display);font-size:1.1rem;font-weight:800;color:var(--cyan)}
.sc .v.g{color:var(--good)}.sc .v.b{color:var(--bad)}
.prog-w{flex:1;min-width:100px}
.prog-l{font-size:.65rem;color:var(--muted2);font-weight:700;margin-bottom:3px}
.prog-t{height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.prog-f{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--comp),var(--sup));transition:width .35s}

/* BUTTONS */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:11px;padding:9px 18px;font-weight:800;font-family:var(--font);font-size:.83rem;cursor:pointer;transition:.15s;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0);box-shadow:none}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}
.btn-cyan{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#07111f}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(37,217,255,.18)}
.btn-magenta{background:linear-gradient(135deg,var(--magenta),var(--magenta2));color:white}

/* FEEDBACK */
.fb{display:none;margin-top:10px;padding:10px 15px;border-radius:10px;font-size:.88rem;font-weight:500;line-height:1.6}
.fb.show{display:block}
.fb.ok{background:rgba(34,197,94,.12);border-left:4px solid var(--good);color:#bbf7d0;border-radius:0 11px 11px 0}
.fb.err{background:rgba(239,68,68,.11);border-left:4px solid var(--bad);color:#fecaca;border-radius:0 11px 11px 0}
.fb.partial{background:rgba(245,158,11,.1);border-left:4px solid var(--warn);color:#fde68a;border-radius:0 11px 11px 0}

/* ═══════════════════════
   FLASHCARDS (EX 0)
═══════════════════════ */
.flash-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.flash-filter{display:flex;gap:4px;flex-wrap:wrap}
.ff-btn{border:0;border-radius:9px;padding:5px 12px;font-size:.76rem;font-weight:800;font-family:var(--font);cursor:pointer;transition:.14s;background:rgba(255,255,255,.07);color:var(--muted);border:1.5px solid transparent}
.ff-btn.active{color:white;border-color:rgba(255,255,255,.3)}
.ff-btn.f-all.active{background:rgba(255,255,255,.12)}
.ff-btn.f-sup.active{background:rgba(244,114,182,.2);border-color:rgba(244,114,182,.4);color:var(--comp2)}
.ff-btn.f-inf.active{background:rgba(37,217,255,.12);border-color:rgba(37,217,255,.3);color:var(--sup2)}
.ff-btn.f-eq.active{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3);color:#fcd34d}
.ff-btn.f-irr.active{background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.3);color:#c4b5fd}
.ff-btn.f-super.active{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);color:#86efac}

.flash-card-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.flash-progress-row{display:flex;align-items:center;gap:12px;width:100%;max-width:640px}
.flash-counter{font-size:.8rem;font-weight:800;color:var(--muted2);white-space:nowrap}
.flash-track{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.flash-fill{height:100%;background:linear-gradient(90deg,var(--comp),var(--sup));border-radius:999px;transition:width .4s}

.flash-card{width:100%;max-width:640px;min-height:220px;perspective:1000px;cursor:pointer}
.flash-inner{position:relative;width:100%;height:100%;min-height:220px;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flash-card.flipped .flash-inner{transform:rotateY(180deg)}
.flash-front,.flash-back{position:absolute;inset:0;border-radius:18px;padding:24px;backface-visibility:hidden;display:flex;flex-direction:column;gap:10px}
.flash-front{background:linear-gradient(135deg,rgba(255,43,191,.12),rgba(0,0,0,0)),rgba(255,255,255,.04);border:1.5px solid rgba(244,114,182,.2)}
.flash-back{background:linear-gradient(135deg,rgba(37,217,255,.1),rgba(0,0,0,0)),rgba(255,255,255,.04);border:1.5px solid rgba(37,217,255,.2);transform:rotateY(180deg)}
.flash-type-tag{font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;border-radius:999px;padding:3px 10px;width:fit-content}
.flash-structure{font-family:var(--display);font-size:1.3rem;font-weight:900;line-height:1.3;color:var(--text)}
.flash-struct-part{display:inline-block;padding:2px 8px;border-radius:6px;margin:2px}
.flash-struct-key{background:rgba(37,217,255,.18);color:var(--cyan);font-weight:900}
.flash-struct-gray{color:var(--muted)}
.flash-example{font-size:.95rem;color:var(--muted);line-height:1.6;padding:10px 14px;background:rgba(255,255,255,.04);border-radius:10px;font-style:italic}
.flash-example strong{color:var(--text);font-style:normal}
.flash-en{font-size:.8rem;color:var(--muted2);line-height:1.5}
.flash-hint{font-size:.72rem;color:var(--muted2);text-align:center;font-style:italic}
.flash-nav{display:flex;gap:8px;align-items:center;width:100%;max-width:640px;justify-content:center}

/* ═══════════════════════
   MULTIPLE CHOICE (EX 1)
═══════════════════════ */
.mc-list{display:flex;flex-direction:column;gap:10px}
.mc-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 16px}
.mc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.mc-num{font-size:.62rem;font-weight:900;background:rgba(255,255,255,.06);border-radius:6px;padding:3px 7px;flex-shrink:0;margin-top:2px}
.mc-sent{font-size:1rem;line-height:1.65;flex:1}
.mc-blank{display:inline-block;min-width:80px;border-bottom:2.5px solid rgba(37,217,255,.4);padding:0 4px;text-align:center;font-weight:800;color:var(--cyan)}
.mc-en{font-size:.78rem;color:var(--muted2);font-style:italic;margin-bottom:10px;padding-left:28px}
.mc-opts{display:flex;flex-wrap:wrap;gap:7px;padding-left:28px}
.mc-opt{border:0;border-radius:10px;padding:7px 14px;font-weight:700;font-family:var(--font);font-size:.88rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.mc-opt:hover:not(:disabled){transform:translateY(-1px);background:rgba(37,217,255,.09);border-color:rgba(37,217,255,.35)}
.mc-opt:disabled{cursor:default;transform:none}
.mc-opt.mc-ok{border-color:var(--good);background:rgba(34,197,94,.14);color:#86efac}
.mc-opt.mc-err{border-color:var(--bad);background:rgba(239,68,68,.12);color:#fca5a5}
.mc-opt.mc-show{border-color:var(--good);background:rgba(34,197,94,.1);color:#86efac}
.mc-expl{display:none;font-size:.79rem;color:var(--muted);line-height:1.55;margin-top:7px;padding:7px 12px 7px 28px;background:rgba(255,255,255,.04);border-radius:8px}
.mc-expl.show{display:block}
.mc-tag{font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.mc-tag.t-sup{background:rgba(244,114,182,.2);color:var(--comp2)}
.mc-tag.t-inf{background:rgba(37,217,255,.15);color:var(--sup2)}
.mc-tag.t-eq{background:rgba(245,158,11,.15);color:#fcd34d}
.mc-tag.t-irr{background:rgba(167,139,250,.15);color:#c4b5fd}
.mc-tag.t-super{background:rgba(34,197,94,.15);color:#86efac}
.mc-tag.t-err{background:rgba(239,68,68,.15);color:#fca5a5}

/* ═══════════════════════
   ERROR HUNT (EX 2)
═══════════════════════ */
.eh-list{display:flex;flex-direction:column;gap:9px}
.eh-item{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:13px;padding:13px 15px;display:flex;align-items:flex-start;gap:11px}
.eh-item.eh-ok{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.05)}
.eh-item.eh-bad{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.05)}
.eh-n{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:900;color:var(--muted2);flex-shrink:0;margin-top:1px}
.eh-body{flex:1}
.eh-sent{font-size:.97rem;line-height:1.6}
.eh-fix{font-size:.82rem;font-weight:700;color:var(--good);margin-left:6px}
.eh-btns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.eh-btn{border:0;border-radius:9px;padding:7px 15px;font-weight:800;font-family:var(--font);font-size:.82rem;cursor:pointer;transition:.14s;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);color:var(--text)}
.eh-yes:hover:not(:disabled){border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1);color:#86efac}
.eh-no:hover:not(:disabled){border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#fca5a5}
.eh-btn:disabled{cursor:default;opacity:.5}
.cho-ok{border-color:var(--good)!important;background:rgba(34,197,94,.18)!important;color:#86efac!important;opacity:1!important}
.cho-err{border-color:var(--bad)!important;background:rgba(239,68,68,.14)!important;color:#fca5a5!important;opacity:1!important}
.eh-exp{display:none;font-size:.79rem;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);line-height:1.55}
.revealed .eh-exp{display:block}

/* ═══════════════════════
   DRAG & SORT (EX 3)
═══════════════════════ */
.sort-pile{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;min-height:52px;margin-bottom:12px}
.sort-bucket{border-radius:14px;padding:12px;min-height:80px;display:flex;flex-direction:column;gap:6px;transition:.2s}
.sort-bucket.drag-over{box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.bucket-title{font-family:var(--display);font-size:.78rem;font-weight:900;text-align:center}
.bucket-sub{font-size:.62rem;color:var(--muted2);text-align:center;line-height:1.35}
.sort-card{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:9px;padding:7px 12px;font-size:.84rem;font-weight:600;cursor:grab;user-select:none;transition:.15s;line-height:1.4}
.sort-card:hover{transform:translateY(-2px);border-color:rgba(37,217,255,.4)}
.sort-card.ghost{opacity:.35}
.sort-card.c-ok{background:rgba(34,197,94,.14);border-color:var(--good);color:#86efac;cursor:default}
.sort-card.c-err{background:rgba(239,68,68,.1);border-color:var(--bad);color:#fca5a5;font-size:.78rem}

/* ═══════════════════════
   SPEED ROUND (EX 4)
═══════════════════════ */
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-stats{display:flex;gap:9px}
.spst{background:rgba(255,255,255,.05);border:1px solid rgba(37,217,255,.12);border-radius:11px;padding:7px 14px;text-align:center}
.spst .sl{font-size:.56rem;font-weight:800;text-transform:uppercase;color:var(--muted2)}
.spst .sv{font-family:var(--display);font-size:1.2rem;font-weight:900;color:var(--cyan)}
.spst .sv.g{color:var(--good)}.spst .sv.b{color:var(--bad)}.spst .sv.w{color:var(--warn)}
.sp-card{background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:18px;padding:20px;text-align:center;width:100%;max-width:520px}
.sp-q{font-size:1.05rem;line-height:1.7;margin-bottom:4px}
.sp-hint{font-size:.77rem;color:var(--muted2);font-style:italic}
.sp-row{display:flex;gap:8px;justify-content:center;width:100%;max-width:520px}
.sp-inp{flex:1;max-width:280px;background:rgba(255,255,255,.07);border:1.5px solid rgba(37,217,255,.3);border-radius:11px;padding:10px 14px;font-family:var(--font);font-size:1rem;font-weight:700;color:var(--text);outline:none;transition:.15s}
.sp-inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,217,255,.1)}
.sp-inp::placeholder{color:var(--muted2);font-weight:400}
.sp-fb{min-height:38px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;border-radius:9px;padding:0 14px;width:100%;max-width:520px}
.sp-fb.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#86efac}
.sp-fb.err{background:rgba(239,68,68,.11);border:1px solid rgba(239,68,68,.22);color:#fca5a5}
.tmr-row{display:flex;align-items:center;gap:9px;width:100%;max-width:520px}
.tmr-trk{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}
.tmr-fil{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--comp),var(--sup));transition:width 1s linear}
.tmr-n{font-family:var(--display);font-size:.85rem;font-weight:900;color:var(--muted2);min-width:22px;text-align:right}
.sp-start{text-align:center;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-start h2{font-family:var(--display);font-size:1.4rem;font-weight:900}
.sp-start p{color:var(--muted);font-size:.87rem;max-width:420px;line-height:1.6}
.streak{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);border-radius:999px;padding:4px 12px;font-size:.74rem;font-weight:800;color:#fcd34d;display:none}
.streak.on{display:inline-flex;align-items:center;gap:4px}
.cf{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2rem;font-weight:900;color:var(--warn);pointer-events:none;opacity:0;z-index:999}
.cf.pop{animation:cfk .7s ease forwards}
@keyframes cfk{0%{opacity:1;transform:translate(-50%,-60%) scale(.8)}40%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-40%) scale(1)}}

/* ═══════════════════════
   REFERENCE (EX 5)
═══════════════════════ */
.ref-section{margin-bottom:20px}
.ref-h3{font-family:var(--display);font-size:.95rem;font-weight:800;margin-bottom:10px;padding:6px 14px;border-radius:9px;display:inline-flex;align-items:center;gap:6px}
.ref-table{width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:4px}
.ref-table th{padding:7px 12px;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted2);border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
.ref-table td{padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.04);line-height:1.5;vertical-align:top}
.ref-table tr:last-child td{border-bottom:none}
.ref-table tr:hover td{background:rgba(255,255,255,.02)}
.td-es{font-weight:700}.td-en{color:var(--muted2);font-style:italic;font-size:.79rem}.td-ex{color:var(--muted);font-size:.78rem;font-style:italic}
.ref-alert{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:12px;padding:12px 16px;font-size:.84rem;color:#fecaca;line-height:1.6;margin-bottom:12px}
.ref-alert strong{color:var(--bad)}
.ref-tip{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2);border-radius:12px;padding:12px 16px;font-size:.84rem;color:#bbf7d0;line-height:1.6;margin-bottom:12px}
.ref-tip strong{color:var(--good)}
.ref-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.ref-block{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:14px}
.ref-block h4{font-family:var(--display);font-size:.85rem;font-weight:800;margin-bottom:10px}
.irr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.irr-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px}

</header>
<div class="ex-tabs">

<script>
function seededShuffle(arr,seed){const a=[...arr];let s=seed;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)&0xffffffff;const j=Math.abs(s)%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function normS(s){return(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}

/* ══════════════════════════════════
   STATE
══════════════════════════════════ */
let flashIdx=0, flashFilter='all', flashFlipped=false, flashCards=[];
let mcAnswers={}, mcChecked=false;
let ehAnswered={};
let dragItem=null, sortPlaced={}, sortChecked=false, tapSel=null;
let spIdx=0, spOk=0, spErr=0, spStreak=0, spTimer=null, spTimeLeft=0, spAnswered=false;

function goEx(idx){
  [0,1,2,3,4,5].forEach(i=>document.getElementById('etab-'+i).classList.toggle('active',i===idx));
  [renderFlash, renderMC, renderErrorHunt, renderSort, renderSpeed, renderReference][idx]();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ══════════════════════════════════
   EX 0 — FLASHCARDS
   Each card shows: type tag | structure | example | english
══════════════════════════════════ */
const FLASH_DATA = [
  // SUPERIORITY
  {type:'superiority',tag:'Superioridad',tagCls:'t-sup',
   struct:'<span class="flash-struct-key">más</span> <span class="flash-struct-gray">+</span> adjetivo <span class="flash-struct-gray">+</span> <span class="flash-struct-key">que</span>',
   example:'Mi casa es <strong>más grande que</strong> tu casa.',
   en:'My house is bigger than your house.',
   tip:'Use with adjectives to say something has MORE of a quality.'},
  {type:'superiority',tag:'Superioridad',tagCls:'t-sup',
   struct:'verbo <span class="flash-struct-gray">+</span> <span class="flash-struct-key">más que</span>',
   example:'Carlos estudia <strong>más que</strong> Luis.',
   en:'Carlos studies more than Luis.',
   tip:'Compare actions — no adjective needed.'},
  {type:'superiority',tag:'Superioridad',tagCls:'t-sup',
   struct:'<span class="flash-struct-key">más</span> <span class="flash-struct-gray">+</span> sustantivo <span class="flash-struct-gray">+</span> <span class="flash-struct-key">que</span>',
   example:'Tengo <strong>más libros que</strong> tú.',
   en:'I have more books than you.',
   tip:'Comparing quantities of nouns.'},
  {type:'superiority',tag:'Superioridad',tagCls:'t-sup',
   struct:'<span class="flash-struct-key">más de</span> <span class="flash-struct-gray">+</span> número',
   example:'Tengo <strong>más de</strong> veinte estudiantes.',
   en:'I have more than twenty students.',
   tip:'"más de" (not "más que") is used before numbers.'},
  // INFERIORITY
  {type:'inferiority',tag:'Inferioridad',tagCls:'t-inf',
   struct:'<span class="flash-struct-key">menos</span> <span class="flash-struct-gray">+</span> adjetivo <span class="flash-struct-gray">+</span> <span class="flash-struct-key">que</span>',
   example:'Este restaurante es <strong>menos caro que</strong> el otro.',
   en:'This restaurant is less expensive than the other.',
   tip:'Use to say something has LESS of a quality.'},
  {type:'inferiority',tag:'Inferioridad',tagCls:'t-inf',
   struct:'verbo <span class="flash-struct-gray">+</span> <span class="flash-struct-key">menos que</span>',
   example:'Ahora duermo <strong>menos que</strong> antes.',
   en:'Now I sleep less than before.',
   tip:'Compare actions with less frequency or intensity.'},
  {type:'inferiority',tag:'Inferioridad',tagCls:'t-inf',
   struct:'<span class="flash-struct-key">menos</span> <span class="flash-struct-gray">+</span> sustantivo <span class="flash-struct-gray">+</span> <span class="flash-struct-key">que</span>',
   example:'Tengo <strong>menos tiempo que</strong> ayer.',
   en:'I have less time than yesterday.',
   tip:'Comparing smaller quantities of nouns.'},
  // EQUALITY
  {type:'equality',tag:'Igualdad',tagCls:'t-eq',
   struct:'<span class="flash-struct-key">tan</span> <span class="flash-struct-gray">+</span> adjetivo <span class="flash-struct-gray">+</span> <span class="flash-struct-key">como</span>',
   example:'Ana es <strong>tan inteligente como</strong> Laura.',
   en:'Ana is as intelligent as Laura.',
   tip:'"tan…como" = "as…as" in English.'},
  {type:'equality',tag:'Igualdad',tagCls:'t-eq',
   struct:'verbo <span class="flash-struct-gray">+</span> <span class="flash-struct-key">tanto como</span>',
   example:'Yo estudio <strong>tanto como</strong> tú.',
   en:'I study as much as you.',
   tip:'Equal actions — "tanto como" never changes.'},
  {type:'equality',tag:'Igualdad',tagCls:'t-eq',
   struct:'<span class="flash-struct-key">tanto/a/os/as</span> <span class="flash-struct-gray">+</span> sustantivo <span class="flash-struct-gray">+</span> <span class="flash-struct-key">como</span>',
   example:'Tengo <strong>tantos libros como</strong> tú.',
   en:'I have as many books as you.',
   tip:'"tanto" agrees with the noun: tanto/tanta/tantos/tantas.'},
  // IRREGULAR
  {type:'irregular',tag:'Irregular',tagCls:'t-irr',
   struct:'bueno <span class="flash-struct-gray">→</span> <span class="flash-struct-key">mejor</span> <span class="flash-struct-gray">que</span>',
   example:'Este café es <strong>mejor que</strong> el otro.',
   en:'This coffee is better than the other.',
   tip:'Never say "más bueno que" in formal Spanish.'},
  {type:'irregular',tag:'Irregular',tagCls:'t-irr',
   struct:'malo <span class="flash-struct-gray">→</span> <span class="flash-struct-key">peor</span> <span class="flash-struct-gray">que</span>',
   example:'Esta película es <strong>peor que</strong> la primera.',
   en:'This movie is worse than the first one.',
   tip:'Never say "más malo que" in formal Spanish.'},
  {type:'irregular',tag:'Irregular',tagCls:'t-irr',
   struct:'grande (edad) <span class="flash-struct-gray">→</span> <span class="flash-struct-key">mayor</span> <span class="flash-struct-gray">que</span>',
   example:'Mi hermano es <strong>mayor que</strong> yo.',
   en:'My brother is older than me.',
   tip:'"mayor" = older. "más grande" = physically bigger.'},
  {type:'irregular',tag:'Irregular',tagCls:'t-irr',
   struct:'pequeño (edad) <span class="flash-struct-gray">→</span> <span class="flash-struct-key">menor</span> <span class="flash-struct-gray">que</span>',
   example:'Mi hermana es <strong>menor que</strong> yo.',
   en:'My sister is younger than me.',
   tip:'"menor" = younger. "más pequeño" = physically smaller.'},
  // SUPERLATIVES
  {type:'superlative',tag:'Superlativo',tagCls:'t-super',
   struct:'el/la/los/las <span class="flash-struct-gray">+</span> <span class="flash-struct-key">más</span> <span class="flash-struct-gray">+</span> adjetivo <span class="flash-struct-gray">+</span> de',
   example:'Carlos es <strong>el más alto de</strong> la clase.',
   en:'Carlos is the tallest in the class.',
   tip:'Superlativo relativo — comparing within a group.'},
  {type:'superlative',tag:'Superlativo',tagCls:'t-super',
   struct:'el/la/los/las <span class="flash-struct-gray">+</span> <span class="flash-struct-key">menos</span> <span class="flash-struct-gray">+</span> adjetivo <span class="flash-struct-gray">+</span> de',
   example:'Es <strong>el menos caro de</strong> la tienda.',
   en:'It is the least expensive in the store.',

   struct:'<span class="flash-struct-key">el mejor / el peor / el mayor / el menor</span>',
   example:'Este es <strong>el mejor</strong> restaurante de la zona.',
   en:'This is the best restaurant in the area.',

   example:'La clase es <strong>muy interesante</strong>.',
   en:'The class is very interesting.',
   tip:'Simplest superlativo absoluto. No comparison with a group.'},

   tip:'"más de lo que" compares with a whole idea/clause.'},

const TYPE_COLORS = {
  superiority:{bg:'rgba(244,114,182,.12)',bd:'rgba(244,114,182,.25)',tag:'#ff91cd'},
  inferiority:{bg:'rgba(37,217,255,.09)',bd:'rgba(37,217,255,.2)',tag:'#7ee8ff'},
  equality:{bg:'rgba(245,158,11,.09)',bd:'rgba(245,158,11,.2)',tag:'#fcd34d'},
  irregular:{bg:'rgba(167,139,250,.1)',bd:'rgba(167,139,250,.22)',tag:'#c4b5fd'},
  superlative:{bg:'rgba(34,197,94,.09)',bd:'rgba(34,197,94,.2)',tag:'#86efac'},
};

function getFilteredCards(){
  if(flashFilter==='all') return FLASH_DATA;
  return FLASH_DATA.filter(c=>c.type===flashFilter);
}

function renderFlash(){
  flashCards = getFilteredCards();
  if(flashIdx>=flashCards.length) flashIdx=0;
  flashFlipped=false;
  renderFlashCard();
}

function renderFlashCard(){
  if(!flashCards.length){
    document.getElementById('exContainer').innerHTML=`<div class="panel"><p style="text-align:center;color:var(--muted);padding:20px">No cards match this filter.</p></div>`;
    return;
  }
  const item=flashCards[flashIdx];
  const col=TYPE_COLORS[item.type];
  const pct=Math.round((flashIdx+1)/flashCards.length*100);

  const filters=[
    {id:'all',label:'All',cls:'f-all'},
    {id:'superiority',label:'Superioridad',cls:'f-sup'},
    {id:'inferiority',label:'Inferioridad',cls:'f-inf'},
    {id:'equality',label:'Igualdad',cls:'f-eq'},
    {id:'irregular',label:'Irregulares',cls:'f-irr'},
    {id:'superlative',label:'Superlativos',cls:'f-super'},
  ].map(f=>`<button class="ff-btn ${f.cls}${flashFilter===f.id?' active':''}" onclick="setFilter('${f.id}')">${f.label}</button>`).join('');

  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">&#128274; Flashcards</div>
  <div class="ex-instr">Click any card to flip it and see the example. Filter by type with the buttons below.</div>
  <div class="flash-controls">
    <div class="flash-filter">${filters}</div>
  </div>
  <div class="flash-card-wrap">
    <div class="flash-progress-row">
      <span class="flash-counter">${flashIdx+1} / ${flashCards.length}</span>
      <div class="flash-track"><div class="flash-fill" style="width:${pct}%"></div></div>
      <span class="flash-counter" style="color:var(--muted2)">${item.tag}</span>
    </div>
    <div class="flash-card${flashFlipped?' flipped':''}" id="flashCard" onclick="flipCard()">
      <div class="flash-inner">
        <div class="flash-front" style="background:linear-gradient(135deg,${col.bg},rgba(0,0,0,0)),rgba(255,255,255,.04);border-color:${col.bd}">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span class="mc-tag ${item.tagCls}" style="font-size:.7rem">${item.tag}</span>
            <span style="font-size:.72rem;color:var(--muted2);font-style:italic">estructura</span>
          </div>
          <div class="flash-structure" style="font-size:1.25rem;margin:8px 0">${item.struct}</div>
          <div style="flex:1"></div>
          <div class="flash-hint">&#128161; Click to see an example</div>
        </div>
        <div class="flash-back" style="border-color:${col.bd}">
          <span class="mc-tag ${item.tagCls}" style="font-size:.7rem;margin-bottom:4px">${item.tag}</span>
          <div class="flash-example">${item.example}</div>
          <div class="flash-en">${item.en}</div>
          <div style="font-size:.78rem;color:var(--muted);padding:8px 12px;background:rgba(255,255,255,.04);border-radius:8px;line-height:1.5;margin-top:4px">&#128161; ${item.tip}</div>
        </div>
      </div>
    </div>
    <div class="flash-nav">
      <button class="btn btn-ghost" onclick="prevFlash()" ${flashIdx===0?'disabled':''}>&#8592; Prev</button>
      <button class="btn btn-ghost" onclick="flipCard()">&#8635; Flip</button>
      <button class="btn btn-cyan" onclick="nextFlash()" ${flashIdx===flashCards.length-1?'disabled':''}>Next &#8594;</button>
    </div>
    <p style="font-size:.72rem;color:var(--muted2);text-align:center">${flashIdx+1} of ${flashCards.length} ${item.tag} cards</p>
  </div></div>`;
}

function flipCard(){
  flashFlipped=!flashFlipped;
  const c=document.getElementById('flashCard');
  if(c)c.classList.toggle('flipped',flashFlipped);
}
function nextFlash(){flashIdx=Math.min(flashCards.length-1,flashIdx+1);flashFlipped=false;renderFlashCard();}
function prevFlash(){flashIdx=Math.max(0,flashIdx-1);flashFlipped=false;renderFlashCard();}
function setFilter(f){flashFilter=f;flashIdx=0;renderFlash();}


/* ══════════════════════════════════
   EX 1 — MULTIPLE CHOICE (50)
══════════════════════════════════ */
const MC=[
  // SUPERIORITY — adjectives
  {s:'Mi casa es ___ grande ___ tu casa.',e:'My house is bigger than your house.',o:['tan...como','más...que','menos...que','el más...de'],a:1,tag:'t-sup',x:'"más + adj + que" = more...than. Comparativo de superioridad.'},
  {s:'Carlos es ___ alto ___ Luis.',e:'Carlos is taller than Luis.',o:['tan...como','menos...que','más...que','el...de'],a:2,tag:'t-sup',x:'"más alto que" — comparative of superiority with adjectives.'},

  {s:'Tengo ___ trabajo ___ ayer.',e:'I have more work than yesterday.',o:['menos...que','tanto...como','más...que','tantos...como'],a:2,tag:'t-sup',x:'"más + sustantivo + que" — comparing quantities.'},
  {s:'En mi ciudad hay ___ tráfico ___ en la tuya.',e:'In my city there is more traffic than in yours.',o:['tan...como','menos...que','más...que','tantos...como'],a:2,tag:'t-sup',x:'"más tráfico que" — more traffic than.'},

  {s:'Ella trabaja ___ su hermano.',e:'She works more than her brother.',o:['menos que','tanto como','más que','tan como'],a:2,tag:'t-sup',x:'"verbo + más que" — comparing actions.'},
  {s:'Tengo ___ veinte alumnos en mi clase.',e:'I have more than twenty students in my class.',o:['más que','más de','menos de','tan que'],a:1,tag:'t-sup',x:'"más de + número" — use "de" before numbers, not "que".'},
  {s:'El boleto cuesta ___ cien pesos.',e:'The ticket costs more than a hundred pesos.',o:['más que','menos que','más de','tan que'],a:2,tag:'t-sup',x:'"más de" before numbers. "más que" is for comparisons.'},

  {s:'Este restaurante es ___ caro ___ el otro.',e:'This restaurant is less expensive than the other.',o:['más...que','tan...como','menos...que','el menos...de'],a:2,tag:'t-inf',x:'"menos + adj + que" = less...than. Comparativo de inferioridad.'},
  {s:'El español es ___ difícil ___ el chino para muchos estudiantes.',e:'Spanish is less difficult than Chinese for many students.',o:['más...que','menos...que','tan...como','el más...de'],a:1,tag:'t-inf',x:'"menos difícil que" — less difficult than.'},
  {s:'Ahora duermo ___ antes.',e:'Now I sleep less than before.',o:['más que','tanto como','menos que','tan que'],a:2,tag:'t-inf',x:'"verbo + menos que" — comparing actions with inferiority.'},
  {s:'Tengo ___ tiempo ___ ayer.',e:'I have less time than yesterday.',o:['más...que','tanto...como','menos...que','tan...que'],a:2,tag:'t-inf',x:'"menos + sustantivo + que" — fewer/less quantity.'},
  {s:'La clase dura ___ una hora.',e:'The class lasts less than an hour.',o:['más de','menos de','más que','menos que'],a:1,tag:'t-inf',x:'"menos de + number" — less than a number.'},
  // EQUALITY — tan...como
  {s:'Ana es ___ inteligente ___ Laura.',e:'Ana is as intelligent as Laura.',o:['más...que','tan...como','menos...que','tan...que'],a:1,tag:'t-eq',x:'"tan + adj + como" = as...as. Comparativo de igualdad.'},
  {s:'Mi perro es ___ pequeño ___ el tuyo.',e:'My dog is as small as yours.',o:['más...que','menos...que','tan...como','el más...de'],a:2,tag:'t-eq',x:'"tan pequeño como" — as small as.'},
  {s:'La comida mexicana es ___ deliciosa ___ la italiana.',e:'Mexican food is as delicious as Italian food.',o:['más...que','menos...que','tan...como','tanto...como'],a:2,tag:'t-eq',x:'"tan deliciosa como" — as delicious as.'},
  // EQUALITY — tanto como / tantos
  {s:'Yo estudio ___ tú.',e:'I study as much as you.',o:['tan como','tanto como','tantos como','más que'],a:1,tag:'t-eq',x:'"verbo + tanto como" — equal actions. "tanto" never changes here.'},
  {s:'Ella trabaja ___ su esposo.',e:'She works as much as her husband.',o:['tan como','más que','tanto como','menos que'],a:2,tag:'t-eq',x:'"tanto como" after a verb — comparing equal actions.'},
  {s:'Tengo ___ libros ___ tú.',e:'I have as many books as you.',o:['tanto...como','tantos...como','tan...como','tanta...como'],a:1,tag:'t-eq',x:'"tantos + sustantivo masculino plural + como" = as many as.'},
  {s:'Ella tiene ___ paciencia ___ su mamá.',e:'She has as much patience as her mom.',o:['tanto...como','tantos...como','tanta...como','tan...como'],a:2,tag:'t-eq',x:'"tanta + sustantivo femenino + como" — agree in gender/number.'},
  {s:'Hay ___ estudiantes hoy ___ ayer.',e:'There are as many students today as yesterday.',o:['tanta...como','tantos...como','tanto...como','tan...como'],a:1,tag:'t-eq',x:'"tantos" agrees with "estudiantes" (m. plural).'},
  // IRREGULAR COMPARATIVES
  {s:'Este café es ___ el otro.',e:'This coffee is better than the other.',o:['más bueno que','más malo que','mejor que','mayor que'],a:2,tag:'t-irr',x:'"mejor que" = better than. Never "más bueno que" in formal Spanish.'},

const ERRORS=[

  ['Ana es tan inteligente como Laura.',false,null,'CORRECT ✓ — "tan + adj + como" = as...as. Perfect equality comparative.'],
  ['Tengo más de veinte estudiantes.',false,null,'CORRECT ✓ — "más de + number". Correct! Use "de" before numbers.'],
  ['Carlos estudia más que Luis.',false,null,'CORRECT ✓ — "verbo + más que" = comparative of action with superiority.'],
  ['Esta película es más peor que la primera.',true,'peor que la primera','ERROR — "peor" is already comparative. "más peor" is redundant. Just say "peor que".'],
  ['Mi hermana es más pequeña de edad que yo.',true,'menor que yo','ERROR — For age: use <strong>menor</strong>, not "más pequeña". "Más pequeña" = physically smaller.'],
  ['Gasté menos de lo que esperaba.',false,null,'CORRECT ✓ — "menos de lo que + clause" is the correct structure.'],
  ['Hay tantas personas como ayer.',false,null,'CORRECT ✓ — "tantas" agrees with "personas" (feminine plural). ✓'],
  ['Tengo más libros que tú.',false,null,'CORRECT ✓ — "más + sustantivo + que" = comparing quantities. ✓'],
  ['El examen estuvo muy dificilísimo.',true,'dificilísimo / muy difícil','ERROR — Never combine "muy" + "-ísimo". They both intensify, so it is redundant. Use one or the other.'],
  ['Mi hermano es mayor que yo.',false,null,'CORRECT ✓ — "mayor" = older. Correct irregular comparative for age.'],
  ['Esta casa es más grande que esa.',false,null,'CORRECT ✓ — "más grande que" = physically bigger. Correct use of size.'],
  ['Ella habla español tan bien que yo.',true,'tan bien como yo','ERROR — Equality structure: <strong>tan + adverb + como</strong>, not "que". "Como" = as.'],
  ['Es el restaurante más mejor de la ciudad.',true,'el mejor restaurante de la ciudad','ERROR — "mejor" is already superlative. "más mejor" is redundant — just "el mejor".'],
  ['Tengo tanta paciencia como mi mamá.',false,null,'CORRECT ✓ — "tanta" agrees with "paciencia" (feminine singular). ✓'],
];

function renderErrorHunt(){
  ehAnswered={};
  let html=`<div class="panel"><div class="ex-title">&#128269; Error hunter</div>
  <div class="ex-instr">Each sentence is <em>independent</em>. Is the comparative or superlative structure correct? Judge before seeing the explanation.</div>
  <div class="score-bar"><div class="sc"><span class="l">Total</span><span class="v">${ERRORS.length}</span></div><div class="sc"><span class="l">Correct</span><span class="v g" id="eh_ok">0</span></div><div class="sc"><span class="l">Wrong</span><span class="v b" id="eh_err">0</span></div><div class="prog-w"><div class="prog-l">Progress: <span id="eh_pct">0%</span></div><div class="prog-t"><div class="prog-f" id="eh_pg" style="width:0%"></div></div></div></div>
  <div class="eh-list">`;
  ERRORS.forEach(([s,hasErr,,exp],i)=>{
    html+=`<div class="eh-item" id="ehi${i}"><div class="eh-n">${i+1}</div>
    <div class="eh-body"><div class="eh-sent" id="ehs${i}">${s}</div>
    <div class="eh-btns"><button class="eh-btn eh-yes" onclick="judgeEh(${i},false)">&#9989; Correct</button><button class="eh-btn eh-no" onclick="judgeEh(${i},true)">&#10060; Has an error</button></div>
    <div class="eh-exp" id="ehe${i}">${exp}</div></div></div>`;
  });
  html+=`</div><div class="fb" id="eh_fb" style="margin-top:12px"></div>
  <div class="actions"><button class="btn btn-ghost" onclick="ehAnswered={};renderErrorHunt()">&#8635; Reset</button></div></div>`;
  document.getElementById('exContainer').innerHTML=html;
}
function judgeEh(idx,saysErr){
  if(ehAnswered[idx]!==undefined)return;
  const [s,hasErr,fix,exp]=ERRORS[idx];
  const correct=saysErr===hasErr;
  ehAnswered[idx]=correct;
  const item=document.getElementById('ehi'+idx);
  item.classList.add('revealed',correct?'eh-ok':'eh-bad');
  item.querySelectorAll('.eh-btn').forEach(b=>b.disabled=true);
  const chosen=item.querySelector(saysErr?'.eh-no':'.eh-yes');
  if(chosen)chosen.classList.add(correct?'cho-ok':'cho-err');
  if(hasErr&&fix){const se=document.getElementById('ehs'+idx);se.innerHTML=s+` <span class="eh-fix">&#8594; <strong>${fix}</strong></span>`;}
  document.getElementById('ehe'+idx).classList.add('show');
  const total=Object.keys(ehAnswered).length;
  const ok=Object.values(ehAnswered).filter(v=>v).length;
  document.getElementById('eh_ok').textContent=ok;
  document.getElementById('eh_err').textContent=total-ok;
  document.getElementById('eh_pct').textContent=Math.round(total/ERRORS.length*100)+'%';
  document.getElementById('eh_pg').style.width=Math.round(total/ERRORS.length*100)+'%';
  if(total===ERRORS.length){
    const pct=Math.round(ok/ERRORS.length*100);
    const fb=document.getElementById('eh_fb');
    fb.className='fb show '+(pct>=80?'ok':'partial');
    fb.innerHTML=`${pct>=80?'&#127942;':'&#128218;'} <strong>${ok}/${ERRORS.length}.</strong> ${pct>=80?'Excellent!':'Review the corrections above.'}`;
  }
}

function renderSort(){

function ds(e,id){dragItem=id;setTimeout(()=>{const c=document.getElementById('sc_'+id);if(c)c.classList.add('ghost');},0);}
function de(){if(dragItem){const c=document.getElementById('sc_'+dragItem);if(c)c.classList.remove('ghost');}dragItem=null;}
function drop(e,bId){e.preventDefault();const id=e.dataTransfer?e.dataTransfer.getData('text'):dragItem;document.getElementById('bk_'+bId).classList.remove('drag-over');if(!id||sortPlaced[id])return;placeCard(id,bId);}
function tapCard(id){if(sortPlaced[id])return;const c=document.getElementById('sc_'+id);if(!c)return;if(tapSel===id){c.style.boxShadow='';tapSel=null;return;}if(tapSel){const p=document.getElementById('sc_'+tapSel);if(p)p.style.boxShadow='';}tapSel=id;c.style.boxShadow='0 0 0 3px var(--cyan)';}
function tapBucket(bId){if(!tapSel)return;placeCard(tapSel,bId);tapSel=null;}
function placeCard(id,bId){

  if(!card||!bk)return;card.style.boxShadow='';card.classList.remove('ghost');card.draggable=false;
  const b=BUCKETS.find(x=>x.id===bId);if(b)card.style.borderColor=b.col;

}
function returnCard(id){if(sortChecked)return;delete sortPlaced[id];const c=document.getElementById('sc_'+id);const pile=document.getElementById('sPile');if(!c||!pile)return;c.style.borderColor='';c.style.boxShadow='';c.draggable=true;c.onclick=()=>tapCard(id);pile.appendChild(c);const btn=document.getElementById('srtChk');if(btn)btn.disabled=true;}
function checkSort(){
  sortChecked=true;let ok=0;
  CARDS.forEach(item=>{const c=document.getElementById('sc_'+item.id);if(!c)return;const isOk=sortPlaced[item.id]===item.b;if(isOk)ok++;c.className='sort-card '+(isOk?'c-ok':'c-err');c.draggable=false;c.onclick=null;if(!isOk){const b=BUCKETS.find(x=>x.id===item.b);c.innerHTML=`${item.t}<span style="font-size:.7rem;display:block;margin-top:2px">&#8594; ${b?b.icon+' '+b.label:item.b}</span>`;}c.title=item.x;});
  const pct=Math.round(ok/CARDS.length*100);
  const fb=document.getElementById('srtFb');fb.className='fb show '+(pct>=80?'ok':'partial');

  document.getElementById('srtChk').disabled=true;
}

const SPEED=[
  {q:'more...than (superiority)',hint:'más…que',a:'más que',also:[]},
  {q:'less...than (inferiority)',hint:'menos…que',a:'menos que',also:[]},
  {q:'as...as (equality, adjective)',hint:'tan…como',a:'tan como',also:[]},
  {q:'as much as (equality, verb)',hint:'tanto como',a:'tanto como',also:[]},
  {q:'better than (irregular)',hint:'mejor que',a:'mejor que',also:[]},
  {q:'worse than (irregular)',hint:'peor que',a:'peor que',also:[]},
  {q:'older than (age)',hint:'mayor que',a:'mayor que',also:[]},
  {q:'younger than (age)',hint:'menor que',a:'menor que',also:[]},
  {q:'the most/tallest/etc. in a group',hint:'el/la más + adj + de',a:'el mas de',also:['la mas de','los mas de','las mas de']},
  {q:'the best (superlative)',hint:'el mejor',a:'el mejor',also:['la mejor','los mejores']},
  {q:'the worst (superlative)',hint:'el peor',a:'el peor',also:['la peor','los peores']},
  {q:'extremely good → (-ísimo)',hint:'buenísimo',a:'buenisimo',also:['buenisima','buenisimos']},
  {q:'extremely difficult → (-ísimo)',hint:'dificilísimo',a:'dificilisimo',also:['dificilisima']},
  {q:'extremely expensive → (-ísimo)',hint:'carísimo',a:'carisimo',also:['carisima','carisimos']},
  {q:'more than 20 (before a number)',hint:'más de (not "más que")',a:'mas de',also:[]},
  {q:'less than 10 (before a number)',hint:'menos de',a:'menos de',also:[]},
  {q:'more than I thought (with clause)',hint:'más de lo que',a:'mas de lo que',also:[]},
  {q:'less than I expected (with clause)',hint:'menos de lo que',a:'menos de lo que',also:[]},
  {q:'as many books as (masculine plural noun)',hint:'tantos…como',a:'tantos como',also:[]},
  {q:'as much patience as (feminine noun)',hint:'tanta…como',a:'tanta como',also:[]},
  {q:'she works as much as (verb + equality)',hint:'trabaja tanto como',a:'tanto como',also:[]},
  {q:'very interesting (superlativo absoluto)',hint:'muy interesante',a:'muy interesante',also:[]},
  {q:'older (age, not size) → irregular',hint:'mayor',a:'mayor',also:[]},
  {q:'younger (age, not size) → irregular',hint:'menor',a:'menor',also:[]},
  {q:'physically bigger → regular',hint:'más grande',a:'mas grande',also:[]},
  {q:'physically smaller → regular',hint:'más pequeño',a:'mas pequeno',also:['mas pequeño']},
  {q:'"tan" + adjective (equality) — the word after is?',hint:'como',a:'como',also:[]},
  {q:'"más" + adjective (superiority) — the word after is?',hint:'que',a:'que',also:[]},
  {q:'before a specific number, use "más ___"',hint:'de (más de 20)',a:'de',also:[]},
  {q:'the error in: "más mejor que"',hint:'más peor / más mejor are redundant',a:'redundante',also:['redundant','incorrecto','error']},
];
function renderSpeed(){
  if(spTimer){clearInterval(spTimer);spTimer=null;}
  spIdx=0;spOk=0;spErr=0;spStreak=0;spAnswered=false;
  for(let i=SPEED.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[SPEED[i],SPEED[j]]=[SPEED[j],SPEED[i]];}
  document.getElementById('exContainer').innerHTML=`<div class="panel"><div class="ex-title">&#9889; Speed round</div><div class="ex-instr">Type the Spanish structure or answer. 10 seconds per question. Press Enter to confirm.</div>
  <div class="sp-wrap" id="spWrap"><div class="sp-start"><div style="font-size:2.8rem">&#9889;</div><h2>Type in Spanish</h2><p>Comparative and superlative structures. 30 items! Synonyms accepted.</p><button class="btn btn-cyan" onclick="startSpeed()">Let's go!</button></div></div></div>`;
}
function startSpeed(){spIdx=0;spOk=0;spErr=0;spStreak=0;nextQ();}
function nextQ(){
  if(spIdx>=SPEED.length){endSpeed();return;}
  spAnswered=false;const item=SPEED[spIdx];spTimeLeft=10;
  document.getElementById('spWrap').innerHTML=`
    <div class="sp-stats"><div class="spst"><div class="sl">Q</div><div class="sv w">${spIdx+1}/${SPEED.length}</div></div><div class="spst"><div class="sl">OK</div><div class="sv g">${spOk}</div></div><div class="spst"><div class="sl">Miss</div><div class="sv b">${spErr}</div></div></div>
    <div class="streak${spStreak>=3?' on':''}" id="stk">&#128293; x${spStreak}</div>
    <div class="sp-card"><div class="sp-q">${item.q}</div><div class="sp-hint">&#128161; ${item.hint}</div></div>
    <div class="tmr-row"><div class="tmr-trk"><div class="tmr-fil" id="tF" style="width:100%;transition:width 1s linear"></div></div><div class="tmr-n" id="tN">10</div></div>
    <div class="sp-row"><input id="sInp" class="sp-inp" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="type answer…" onkeydown="if(event.key==='Enter')submitQ()"><button class="btn btn-cyan" onclick="submitQ()" style="flex-shrink:0">&#8594;</button></div>
    <div class="sp-fb" id="sFb" style="opacity:0"></div>`;
  setTimeout(()=>{const i=document.getElementById('sInp');if(i)i.focus();},50);
  if(spTimer)clearInterval(spTimer);
  spTimer=setInterval(()=>{
    spTimeLeft--;
    const f=document.getElementById('tF'),n=document.getElementById('tN');
    if(f)f.style.width=Math.max(0,(spTimeLeft/10)*100)+'%';
    if(n){n.textContent=spTimeLeft;n.style.color=spTimeLeft<=2?'var(--bad)':spTimeLeft<=5?'var(--warn)':'var(--muted2)';}
    if(spTimeLeft<=0){clearInterval(spTimer);spTimer=null;if(!spAnswered)submitQ();}
  },1000);
}
function submitQ(){
  const inp=document.getElementById('sInp');if(!inp||spAnswered)return;
  spAnswered=true;if(spTimer){clearInterval(spTimer);spTimer=null;}inp.disabled=true;
  const item=SPEED[spIdx];const nt=normS(inp.value);const na=normS(item.a);
  const isOk=nt===na||item.also.map(normS).includes(nt)||nt.length>0&&(na.includes(nt)||nt.includes(na));
  if(isOk){spOk++;spStreak++;}else{spErr++;spStreak=0;}
  const fb=document.getElementById('sFb');
  if(fb){fb.style.opacity='1';
    if(!inp.value.trim()){fb.className='sp-fb err';fb.innerHTML=`&#9201; Time's up! &#8594; <strong>${item.hint}</strong>`;}
    else if(isOk){fb.className='sp-fb ok';fb.innerHTML=`&#10003; <strong>Correct!</strong>${spStreak>=3?' &#128293; x'+spStreak:''}`;}
    else{fb.className='sp-fb err';fb.innerHTML=`&#10007; <strong>${inp.value}</strong> &#8594; <strong>${item.hint}</strong>`;}}
  if(spStreak>=3){const cf=document.getElementById('cf');cf.textContent='&#128293; x'+spStreak;cf.classList.remove('pop');void cf.offsetWidth;cf.classList.add('pop');}
  spIdx++;setTimeout(nextQ,isOk?700:1400);
}
function endSpeed(){
  const pct=Math.round(spOk/SPEED.length*100);
  const emo=pct>=90?'&#127942;':pct>=70?'&#127881;':pct>=50?'&#128170;':'&#128218;';
  document.getElementById('spWrap').innerHTML=`<div class="sp-start"><div style="font-size:3rem">${emo}</div><h2>${spOk}/${SPEED.length}</h2><p style="color:var(--muted)">${pct>=90?'Excellent!':pct>=70?'Great job!':pct>=50?'Keep studying!':'Check the reference card.'}</p><button class="btn btn-cyan" onclick="startSpeed()">&#8635; Try again</button></div>`;
}

/* ══════════════════════════════════
   EX 5 — REFERENCE CARD
══════════════════════════════════ */
function renderReference(){
  const row=([es,en,ex])=>`<tr><td class="td-es">${es}</td><td class="td-en">${en}</td><td class="td-ex">${ex||''}</td></tr>`;
  const row2=([base,comp,sup,ex])=>`<tr><td class="td-es">${base}</td><td class="td-en">${comp}</td><td style="font-weight:700;color:var(--sup2)">${sup}</td><td class="td-ex">${ex||''}</td></tr>`;
  document.getElementById('exContainer').innerHTML=`<div class="panel">
  <div class="ex-title">&#128218; Reference card</div>
  <div class="ex-instr">Complete guide to comparativos and superlativos. Key rule: <em>mejor/peor/mayor/menor</em> never need "más".</div>

  <div class="ref-section">
    <div class="ref-h3" style="color:var(--comp2);background:rgba(244,114,182,.1)">&#8593; Comparativo de superioridad</div>
    <div class="struct-box"><span class="s-key">más</span><span class="s-plus">+</span><span class="s-gray">adjetivo/sustantivo</span><span class="s-plus">+</span><span class="s-key">que</span> &nbsp;|&nbsp; verbo <span class="s-plus">+</span><span class="s-key">más que</span> &nbsp;|&nbsp; <span class="s-key">más de</span><span class="s-plus">+</span><span class="s-gray">número</span></div>
    <table class="ref-table"><tr><th>Ejemplo</th><th>English</th></tr>
    ${[['Mi casa es más grande que tu casa.','My house is bigger than yours.',''],
       ['Carlos estudia más que Luis.','Carlos studies more than Luis.',''],
       ['Tengo más libros que tú.','I have more books than you.',''],
       ['Hay más de veinte personas.','There are more than twenty people.','más de + number'],
       ['Estudié más de lo que pensaba.','I studied more than I thought.','más de lo que + clause']
    ].map(([es,en,ex])=>`<tr><td class="td-es">${es}</td><td class="td-en">${en}</td><td class="td-ex">${ex}</td></tr>`).join('')}
    </table>
  </div>

  <div class="ref-section">
    <div class="ref-h3" style="color:var(--sup2);background:rgba(37,217,255,.08)">&#8595; Comparativo de inferioridad</div>
    <div class="struct-box"><span class="s-key">menos</span><span class="s-plus">+</span><span class="s-gray">adjetivo/sustantivo</span><span class="s-plus">+</span><span class="s-key">que</span> &nbsp;|&nbsp; verbo <span class="s-plus">+</span><span class="s-key">menos que</span> &nbsp;|&nbsp; <span class="s-key">menos de</span><span class="s-plus">+</span><span class="s-gray">número</span></div>
    <table class="ref-table"><tr><th>Ejemplo</th><th>English</th></tr>
    ${[['Este restaurante es menos caro que el otro.','This restaurant is less expensive than the other.',''],
       ['Duermo menos que antes.','I sleep less than before.',''],
       ['Tengo menos tiempo que ayer.','I have less time than yesterday.',''],
       ['La clase dura menos de una hora.','The class lasts less than an hour.','menos de + number'],
       ['Gasté menos de lo que esperaba.','I spent less than I expected.','menos de lo que + clause']
    ].map(([es,en,ex])=>`<tr><td class="td-es">${es}</td><td class="td-en">${en}</td><td class="td-ex">${ex}</td></tr>`).join('')}
    </table>
  </div>

  <div class="ref-section">
    <div class="ref-h3" style="color:#fcd34d;background:rgba(245,158,11,.08)">&#61; Comparativo de igualdad</div>
    <div class="struct-box"><span class="s-key">tan</span><span class="s-plus">+</span><span class="s-gray">adjetivo</span><span class="s-plus">+</span><span class="s-key">como</span> &nbsp;|&nbsp; verbo <span class="s-plus">+</span><span class="s-key">tanto como</span> &nbsp;|&nbsp; <span class="s-key">tanto/tanta/tantos/tantas</span><span class="s-plus">+</span><span class="s-gray">sustantivo</span><span class="s-plus">+</span><span class="s-key">como</span></div>
    <div class="ref-2col" style="margin-top:10px">
      <div class="ref-block"><h4 style="color:#fcd34d">Con adjetivo</h4>
        <table class="ref-table"><tr><th>Español</th><th>English</th></tr>
        <tr><td class="td-es">Ana es tan inteligente como Laura.</td><td class="td-en">Ana is as intelligent as Laura.</td></tr>
        <tr><td class="td-es">Mi perro es tan pequeño como el tuyo.</td><td class="td-en">My dog is as small as yours.</td></tr>
        </table>
      </div>
      <div class="ref-block"><h4 style="color:#fcd34d">tanto/a/os/as + noun</h4>
        <table class="ref-table"><tr><th>Form</th><th>Use</th></tr>
        <tr><td class="td-es">tanto trabajo</td><td class="td-en">m. singular</td></tr>
        <tr><td class="td-es">tanta paciencia</td><td class="td-en">f. singular</td></tr>
        <tr><td class="td-es">tantos libros</td><td class="td-en">m. plural</td></tr>
        <tr><td class="td-es">tantas personas</td><td class="td-en">f. plural</td></tr>
        </table>
      </div>
    </div>
  </div>

  <div class="ref-section">
    <div class="ref-h3" style="color:#c4b5fd;background:rgba(167,139,250,.1)">&#9889; Comparativos irregulares</div>
    <div class="ref-alert"><strong>&#9888;&#65039; Never say:</strong> "más bueno", "más malo", "más mejor", "más peor" — these are errors. Use the irregular forms below.</div>
    <table class="ref-table"><tr><th>Base</th><th>Comparativo</th><th>Superlativo</th><th>Use</th></tr>
    ${[['bueno','mejor que','el mejor','quality / goodness'],
       ['malo','peor que','el peor','quality / badness'],
       ['grande (edad)','mayor que','el mayor','age / seniority'],
       ['pequeño (edad)','menor que','el menor','age (younger)'],
    ].map(row2).join('')}
    </table>
    <div class="ref-tip" style="margin-top:10px"><strong>&#128161; mayor vs. más grande:</strong> "mayor" = older (age). "más grande" = physically bigger.<br><strong>menor vs. más pequeño:</strong> "menor" = younger/lower. "más pequeño" = physically smaller.</div>
  </div>

  <div class="ref-section">
    <div class="ref-h3" style="color:#86efac;background:rgba(34,197,94,.08)">&#11088; Superlativos</div>
    <div class="ref-2col">
      <div class="ref-block"><h4 style="color:#86efac">Superlativo relativo</h4>
        <div class="struct-box" style="font-size:.82rem">el/la/los/las <span class="s-plus">+</span> <span class="s-key">más/menos</span> <span class="s-plus">+</span> adj <span class="s-plus">+</span> de</div>
        <table class="ref-table"><tr><th>Español</th><th>English</th></tr>
        <tr><td class="td-es">Carlos es el más alto de la clase.</td><td class="td-en">Carlos is the tallest in the class.</td></tr>
        <tr><td class="td-es">Es la menos cara de la tienda.</td><td class="td-en">It's the least expensive in the store.</td></tr>
        <tr><td class="td-es">Este es el mejor restaurante de la zona.</td><td class="td-en">This is the best restaurant in the area.</td></tr>
        </table>
      </div>
      <div class="ref-block"><h4 style="color:#86efac">Superlativo absoluto</h4>
        <table class="ref-table"><tr><th>Form</th><th>Example</th></tr>
        <tr><td class="td-es">muy + adj</td><td class="td-en">muy interesante</td></tr>
        <tr><td class="td-es">súper + adj</td><td class="td-en">súper fácil (MX)</td></tr>
        <tr><td class="td-es">adj + ísimo/a</td><td class="td-en">buenísimo / carísima</td></tr>
        </table>
        <div class="ref-alert" style="margin-top:8px;font-size:.77rem"><strong>Never:</strong> "muy buenísimo" — redundant!</div>
      </div>
    </div>
    <div class="ref-block" style="margin-top:10px"><h4 style="color:#86efac">-ísimo forms</h4>
      <div class="irr-grid">
        ${[['bueno','buenísimo'],['malo','malísimo'],['grande','grandísimo'],['pequeño','pequeñísimo'],['caro','carísimo'],['barato','baratísimo'],['fácil','facilísimo'],['difícil','dificilísimo'],['rápido','rapidísimo'],['bonito','bonitísimo'],['feo','feísimo'],['amable','amabilísimo']].map(([b,f])=>`<div class="irr-card"><span class="irr-base">${b}</span><span class="irr-arrow">&#8594;</span><span class="irr-comp">${f}</span></div>`).join('')}
      </div>
    </div>
  </div>

  <div class="ref-section">
    <div class="ref-h3" style="color:var(--bad);background:rgba(239,68,68,.08)">&#10060; Common errors</div>
    <table class="ref-table"><tr><th>Incorrect</th><th>Correct</th><th>Rule</th></tr>
    ${[['más bueno que','mejor que','"bueno" has irregular comparative'],
       ['más malo que','peor que','"malo" has irregular comparative'],
       ['más mejor','mejor only','"mejor" is already comparative'],
       ['más peor','peor only','"peor" is already comparative'],
       ['muy buenísimo','buenísimo / muy bueno','"muy" and "-ísimo" cannot combine'],
       ['más que veinte','más de veinte','Use "de" before specific numbers'],
       ['más grande (age)','mayor (age)','Size ≠ age. Use mayor for age.'],
       ['más pequeño (age)','menor (age)','Size ≠ age. Use menor for age.'],
       ['tan...que (equality)','tan...como','"como" not "que" for equality'],
    ].map(([inc,cor,rule])=>`<tr><td style="color:var(--bad);font-weight:700;text-decoration:line-through">${inc}</td><td style="color:var(--good);font-weight:700">${cor}</td><td class="td-ex">${rule}</td></tr>`).join('')}
    </table>
  </div>
  </div>`;
}

goEx(0);
</script>
